<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101b35">
  <meta name="description" content="Luma Hop — a free, original three-world platform adventure. Jump, dodge little monsters, and collect the lost lights!">
  <title>Luma Hop — A Little Platform Adventure</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app">
    <header class="site-header">
      <div class="brand" aria-label="Luma Hop">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <div>
          <div class="brand-name">LUMA <span>HOP</span></div>
          <div class="brand-subtitle">A little platform adventure</div>
        </div>
      </div>
      <div class="header-actions">
        <span class="header-note">Made for tiny adventures <span aria-hidden="true">✳</span></span>
        <button class="icon-button" id="soundBtn" type="button" title="Toggle sound (M)" aria-label="Mute sound" aria-pressed="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="sound-wave" d="M15.5 8.5a5 5 0 0 1 0 7"/><path class="sound-wave" d="M19 5a10 10 0 0 1 0 14"/><path class="sound-slash" d="M16 9l5 6m0-6-5 6"/></svg>
        </button>
        <button class="icon-button" id="pauseBtn" type="button" title="Pause (Esc)" aria-label="Pause game">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="4" height="16" rx="1"/><rect x="15" y="4" width="4" height="16" rx="1"/></svg>
        </button>
        <button class="icon-button expand-button" id="fullscreenBtn" type="button" title="Fullscreen" aria-label="Go fullscreen">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/></svg>
        </button>
      </div>
    </header>

    <section class="game-panel" aria-label="Luma Hop game">
      <div class="status-row">
        <div class="status-left">
          <div class="status-chip"><span class="chip-title">WORLD</span> <strong id="worldValue">01 / 03</strong></div>
          <div class="status-chip level-chip"><span class="chip-title">PLACE</span> <strong id="placeValue">Sunbeam Meadows</strong></div>
        </div>
        <div class="status-right">
          <div class="status-chip stars-chip" title="Collected light stars"><span class="chip-spark">✦</span> <strong id="starsValue">0</strong></div>
          <div class="status-chip"><span class="chip-title">TIME</span> <strong class="numeric" id="timeValue">00:00</strong></div>
          <div class="status-chip hearts-chip" aria-label="Three hearts remaining" id="heartsValue"><span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span></div>
        </div>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Level progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="stage" id="stage">
        <canvas id="gameCanvas" width="960" height="540" aria-label="A side-scrolling platform game. Use the arrow keys or A and D to move, and Space, W, or Up Arrow to jump."></canvas>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <div class="game-screen active" id="gameScreen" aria-live="polite">
          <div class="screen-card" id="screenCard"></div>
        </div>
        <div class="corner-decoration" aria-hidden="true"><span>✦</span> 01—03</div>
      </div>
    </section>

    <nav class="touch-controls" id="touchControls" aria-label="Touch game controls">
      <div class="touch-move">
        <button class="touch-key" id="leftBtn" type="button" aria-label="Move left"><svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button>
        <button class="touch-key" id="rightBtn" type="button" aria-label="Move right"><svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 5 7 7-7 7"/></svg></button>
      </div>
      <button class="touch-key jump-key" id="jumpBtn" type="button" aria-label="Jump"><span>↑</span><small>JUMP</small></button>
    </nav>

    <footer class="footer">
      <div class="control-hint"><span class="kbd">←</span><span class="kbd">→</span> or <span class="kbd">A</span><span class="kbd">D</span> move <span class="hint-divider">·</span> <span class="kbd wide">SPACE</span> jump <span class="hint-divider">·</span> <span class="kbd">ESC</span> pause</div>
      <div class="footer-note">Catch the lights. Dodge the grumplings. Find the glowing door. <span aria-hidden="true">✧</span></div>
    </footer>
  </main>
  <script src="game.js" defer></script>
</body>
</html>
